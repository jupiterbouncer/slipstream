<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" style="background:#F4F5F7; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <filter id="bp-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#15171B" flood-opacity="0.05"/>
    </filter>
    <marker id="bp-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FF5A3C"/>
    </marker>
  </defs>

  <!-- Title -->
  <g transform="translate(40, 36)">
    <text font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#15171B">Slipstream 16 KiB Chunking &amp; WebRTC Back-Pressure Model</text>
    <text y="22" font-size="13" font-weight="500" fill="#5B6472">Controlled memory streaming via bufferedAmount &amp; bufferedamountlow (§6)</text>
  </g>

  <!-- Slicing Visualization (Left) -->
  <g transform="translate(40, 90)" filter="url(#bp-shadow)">
    <rect width="400" height="380" rx="14" fill="#FFFFFF" stroke="#E7E9ED" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#15171B">1. File Slicing via File.slice()</text>
    <text x="20" y="52" font-size="11.5" fill="#5B6472">Non-blocking synchronous slice into binary chunks</text>

    <!-- Whole File Bar -->
    <rect x="20" y="80" width="360" height="36" rx="6" fill="#F4F5F7" stroke="#E7E9ED"/>
    <text x="35" y="103" font-size="12" font-weight="600" fill="#15171B">Selected File (e.g. 524,288 Bytes / 512 KiB)</text>

    <!-- Chunk breakdown -->
    <g transform="translate(20, 140)">
      <!-- Chunk 0 -->
      <rect x="0" y="0" width="70" height="48" rx="6" fill="#FFF5F2" stroke="#FF5A3C" stroke-width="1.2"/>
      <text x="35" y="22" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FF5A3C">Chunk 0</text>
      <text x="35" y="38" text-anchor="middle" font-size="10" fill="#5B6472">16,384 B</text>

      <!-- Chunk 1 -->
      <rect x="78" y="0" width="70" height="48" rx="6" fill="#FFF5F2" stroke="#FF5A3C" stroke-width="1.2"/>
      <text x="113" y="22" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FF5A3C">Chunk 1</text>
      <text x="113" y="38" text-anchor="middle" font-size="10" fill="#5B6472">16,384 B</text>

      <!-- Chunk 2 -->
      <rect x="156" y="0" width="70" height="48" rx="6" fill="#FFF5F2" stroke="#FF5A3C" stroke-width="1.2"/>
      <text x="191" y="22" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FF5A3C">Chunk 2</text>
      <text x="191" y="38" text-anchor="middle" font-size="10" fill="#5B6472">16,384 B</text>

      <text x="245" y="30" font-size="16" fill="#5B6472">&bull;&bull;&bull;</text>

      <!-- Chunk N-1 -->
      <rect x="290" y="0" width="70" height="48" rx="6" fill="#FFF5F2" stroke="#FF5A3C" stroke-width="1.2"/>
      <text x="325" y="22" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FF5A3C">Final</text>
      <text x="325" y="38" text-anchor="middle" font-size="10" fill="#5B6472">&le; 16 KiB</text>
    </g>

    <!-- Formula Box -->
    <rect x="20" y="220" width="360" height="135" rx="8" fill="#F4F5F7" stroke="#E7E9ED"/>
    <text x="32" y="245" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#15171B">Protocol Slicing Rules (§3.2):</text>
    <text x="32" y="270" font-size="11.5" fill="#5B6472">&bull; <tspan font-family="monospace">chunkSize = 16384</tspan> (16 KiB)</text>
    <text x="32" y="292" font-size="11.5" fill="#5B6472">&bull; <tspan font-family="monospace">totalChunks = Math.ceil(size / 16384)</tspan></text>
    <text x="32" y="314" font-size="11.5" fill="#5B6472">&bull; Ordered transmission: index 0, 1, 2, ... N-1</text>
    <text x="32" y="336" font-size="11.5" fill="#2E9E83">&bull; Final chunk length: <tspan font-family="monospace">size - (chunkIndex * chunkSize)</tspan></text>
  </g>

  <!-- Back-Pressure Watermark Visualization (Right) -->
  <g transform="translate(480, 90)" filter="url(#bp-shadow)">
    <rect width="440" height="380" rx="14" fill="#FFFFFF" stroke="#E7E9ED" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#15171B">2. Back-Pressure Flow Control (§6)</text>
    <text x="20" y="52" font-size="11.5" fill="#5B6472">Prevents unbounded RAM buffering in RTCPeerConnection</text>

    <!-- Buffer Gauge -->
    <g transform="translate(30, 85)">
      <!-- Meter Background (1.5 MiB Capacity) -->
      <rect x="0" y="0" width="50" height="250" rx="8" fill="#F4F5F7" stroke="#E7E9ED"/>

      <!-- High Water Mark Region (Red/Coral) -->
      <rect x="0" y="0" width="50" height="85" fill="#FDE8E6" stroke="#D93829" stroke-width="1"/>
      <!-- Safe Region (Teal) -->
      <rect x="0" y="170" width="50" height="80" rx="0 0 8 8" fill="#E6F5F1" stroke="#2E9E83" stroke-width="1"/>

      <!-- High Water Line -->
      <line x1="-10" y1="85" x2="80" y2="85" stroke="#D93829" stroke-width="2"/>
      <text x="90" y="89" font-family="monospace" font-size="11" font-weight="700" fill="#D93829">1 MiB (High-Water Mark)</text>
      <text x="90" y="105" font-size="10.5" fill="#5B6472">&rarr; PAUSE sending chunks to prevent buffer overflow</text>

      <!-- Low Threshold Line -->
      <line x1="-10" y1="200" x2="80" y2="200" stroke="#2E9E83" stroke-width="2"/>
      <text x="90" y="204" font-family="monospace" font-size="11" font-weight="700" fill="#2E9E83">256 KiB (Low Threshold)</text>
      <text x="90" y="220" font-size="10.5" fill="#5B6472">&rarr; RESUME on <tspan font-family="monospace">bufferedamountlow</tspan> event</text>

      <!-- Active Buffer Fill simulation -->
      <rect x="8" y="120" width="34" height="122" rx="4" fill="#FF5A3C" opacity="0.8"/>
      <text x="25" y="175" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#FFFFFF">Buffer</text>
    </g>

    <!-- Summary Box -->
    <g transform="translate(120, 260)">
      <rect x="0" y="0" width="300" height="95" rx="8" fill="#F4F5F7" stroke="#E7E9ED"/>
      <text x="14" y="22" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11.5" fill="#15171B">Implementation Guarantee:</text>
      <text x="14" y="42" font-size="10.5" fill="#5B6472">&bull; Never queue an entire 100 MiB file at once</text>
      <text x="14" y="58" font-size="10.5" fill="#5B6472">&bull; Browser memory remains flat and responsive</text>
      <text x="14" y="74" font-size="10.5" fill="#5B6472">&bull; Listeners removed cleanly on finish or cancel</text>
    </g>
  </g>
</svg>
