<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" style="background:#F4F5F7; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="seq-arrow-coral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FF5A3C"/>
    </marker>
    <marker id="seq-arrow-vector" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2E9E83"/>
    </marker>
    <marker id="seq-arrow-steel" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#5B6472"/>
    </marker>
  </defs>

  <!-- Title -->
  <g transform="translate(40, 36)">
    <text font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#15171B">Slipstream Phase 2 — WebRTC Transfer Protocol Lifecycle</text>
    <text y="22" font-size="13" font-weight="500" fill="#5B6472">Sequence specification across RTCDataChannel ("slipstream-transfer")</text>
  </g>

  <!-- Lifeline Columns -->
  <!-- Sender (Left) -->
  <g transform="translate(140, 80)">
    <rect x="-80" y="0" width="160" height="38" rx="8" fill="#15171B"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Sender (Host)</text>
    <line x1="0" y1="38" x2="0" y2="590" stroke="#Mist" stroke-width="2" stroke-dasharray="6 6"/>
  </g>

  <!-- Receiver (Right) -->
  <g transform="translate(820, 80)">
    <rect x="-80" y="0" width="160" height="38" rx="8" fill="#15171B"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Receiver (Joiner)</text>
    <line x1="0" y1="38" x2="0" y2="590" stroke="#Mist" stroke-width="2" stroke-dasharray="6 6"/>
  </g>

  <!-- Steps -->

  <!-- Step 0: SHA-256 pre-calculation -->
  <g transform="translate(140, 140)">
    <rect x="-115" y="-14" width="230" height="28" rx="6" fill="#F4F5F7" stroke="#E7E9ED"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="600" fill="#5B6472">Compute SHA-256 digest on File</text>
  </g>

  <!-- Message 1: file-offer -->
  <g transform="translate(140, 180)">
    <line x1="0" y1="0" x2="675" y2="0" stroke="#FF5A3C" stroke-width="2" marker-end="url(#seq-arrow-coral)"/>
    <rect x="230" y="-14" width="220" height="26" rx="6" fill="#FFFFFF" stroke="#FF5A3C" stroke-width="1.2"/>
    <text x="340" y="3" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FF5A3C">file-offer (name, size, SHA-256)</text>
  </g>

  <!-- Step 2: Receiver decision -->
  <g transform="translate(820, 220)">
    <rect x="-115" y="-14" width="230" height="28" rx="6" fill="#F4F5F7" stroke="#E7E9ED"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="600" fill="#5B6472">Show Preview &rarr; User Clicks Accept</text>
  </g>

  <!-- Message 2: file-accept -->
  <g transform="translate(820, 260)">
    <line x1="0" y1="0" x2="-675" y2="0" stroke="#2E9E83" stroke-width="2" marker-end="url(#seq-arrow-vector)"/>
    <rect x="-450" y="-14" width="220" height="26" rx="6" fill="#FFFFFF" stroke="#2E9E83" stroke-width="1.2"/>
    <text x="-340" y="3" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#2E9E83">file-accept (transferId)</text>
  </g>

  <!-- Message 3: file-start -->
  <g transform="translate(140, 300)">
    <line x1="0" y1="0" x2="675" y2="0" stroke="#FF5A3C" stroke-width="2" marker-end="url(#seq-arrow-coral)"/>
    <rect x="250" y="-14" width="180" height="26" rx="6" fill="#FFFFFF" stroke="#FF5A3C" stroke-width="1.2"/>
    <text x="340" y="3" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FF5A3C">file-start (transferId)</text>
  </g>

  <!-- Streaming Chunks -->
  <g transform="translate(140, 350)">
    <!-- Chunk 0 -->
    <line x1="0" y1="0" x2="675" y2="0" stroke="#FF5A3C" stroke-width="2.2" marker-end="url(#seq-arrow-coral)"/>
    <text x="340" y="-6" text-anchor="middle" font-family="monospace" font-size="11" fill="#15171B">Binary Chunk 0 (ArrayBuffer: 16,384 B)</text>

    <!-- Chunk 1 -->
    <line x1="0" y1="26" x2="675" y2="26" stroke="#FF5A3C" stroke-width="2.2" marker-end="url(#seq-arrow-coral)"/>
    <text x="340" y="20" text-anchor="middle" font-family="monospace" font-size="11" fill="#15171B">Binary Chunk 1 (ArrayBuffer: 16,384 B)</text>

    <!-- Progress update back from receiver -->
    <line x1="680" y1="52" x2="5" y2="52" stroke="#2E9E83" stroke-width="1.8" marker-end="url(#seq-arrow-vector)"/>
    <text x="340" y="46" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#2E9E83">file-progress (bytesReceived, totalBytes)</text>

    <!-- Chunk N-1 -->
    <line x1="0" y1="78" x2="675" y2="78" stroke="#FF5A3C" stroke-width="2.2" marker-end="url(#seq-arrow-coral)"/>
    <text x="340" y="72" text-anchor="middle" font-family="monospace" font-size="11" fill="#15171B">Binary Chunk N-1 (Final Chunk: remainder B)</text>
  </g>

  <!-- Message: file-complete -->
  <g transform="translate(140, 460)">
    <line x1="0" y1="0" x2="675" y2="0" stroke="#FF5A3C" stroke-width="2" marker-end="url(#seq-arrow-coral)"/>
    <rect x="220" y="-14" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#FF5A3C" stroke-width="1.2"/>
    <text x="340" y="3" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FF5A3C">file-complete (bytesSent, SHA-256)</text>
  </g>

  <!-- Step: Reassemble & verify hash -->
  <g transform="translate(820, 500)">
    <rect x="-135" y="-14" width="270" height="28" rx="6" fill="#E6F5F1" stroke="#2E9E83" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="600" fill="#2E9E83">Reassemble Blob &amp; Verify SHA-256</text>
  </g>

  <!-- Message: file-complete-ack -->
  <g transform="translate(820, 545)">
    <line x1="0" y1="0" x2="-675" y2="0" stroke="#2E9E83" stroke-width="2" marker-end="url(#seq-arrow-vector)"/>
    <rect x="-470" y="-14" width="260" height="26" rx="6" fill="#FFFFFF" stroke="#2E9E83" stroke-width="1.2"/>
    <text x="-340" y="3" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#2E9E83">file-complete-ack (status: verified)</text>
  </g>

  <!-- Terminal State: Both Success -->
  <g transform="translate(140, 595)">
    <rect x="-85" y="-14" width="170" height="28" rx="6" fill="#E6F5F1" stroke="#2E9E83"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#2E9E83">&#10003; Sender Success Trail</text>
  </g>

  <g transform="translate(820, 595)">
    <rect x="-95" y="-14" width="190" height="28" rx="6" fill="#E6F5F1" stroke="#2E9E83"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#2E9E83">&#10003; Download Link Unlocked</text>
  </g>

  <!-- Footer note -->
  <g transform="translate(480, 680)">
    <text text-anchor="middle" font-size="11.5" fill="#5B6472">Note: At any failure or cancellation, file-cancel or file-error is emitted immediately, partial buffers are purged, and download is suppressed.</text>
  </g>
</svg>
