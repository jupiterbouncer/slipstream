ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:${PORT}>
    DocumentRoot "/opt/slipstream/public"
    DirectoryIndex index.html
    <Directory "/opt/slipstream/public">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    AliasMatch "^/sessions(?:/.*)?$" "/opt/slipstream/api/sessions.php"
    <Directory "/opt/slipstream/api">
        Options None
        AllowOverride None
        Require all denied
        <Files "sessions.php">
            Require all granted
            SetHandler application/x-httpd-php
            LimitRequestBody 65535
        </Files>
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    # Keep temporary pairing codes out of application access logs.
    CustomLog /proc/self/fd/1 "%m %>s"
    ErrorLog /proc/self/fd/2
</VirtualHost>
